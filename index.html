<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NorthLife — Privacy-First, Offline-Capable Modular Personal Health Operating System."/>
  <title>NorthLife — Personal Health OS</title>

  <!-- Google Fonts: Strictly Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Pure Native CSS Design System (Zero Frameworks) -->
  <link rel="stylesheet" href="assets/css/reset.css"/>
  <link rel="stylesheet" href="assets/css/variables.css"/>
  <link rel="stylesheet" href="assets/css/layout.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
</head>
<body>
  <div class="app-container">
    <!-- Minimalist Clean Sidebar (240px wide) -->
    <aside class="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-top">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-identity">
            <div class="brand-logo-badge">NL</div>
            <div class="brand-title-group">
              <span class="brand-name">NorthLife</span>
              <span class="brand-subtitle">Health & Daily Living</span>
            </div>
          </div>
        </div>

        <!-- Navigation Links with Clean Tabler Icons -->
        <nav class="sidebar-nav">
          <!-- Active Overview -->
          <a href="#dashboard" class="nav-link nav-link--active" data-route="dashboard">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M4 4h6v8h-6z"></path>
              <path d="M4 16h6v4h-6z"></path>
              <path d="M14 12h6v8h-6z"></path>
              <path d="M14 4h6v4h-6z"></path>
            </svg>
            <span>Overview</span>
          </a>

          <!-- Hydration -->
          <a href="#water" class="nav-link" data-route="water">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M7.502 19.423c2.602 2.105 6.394 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z"></path>
            </svg>
            <span>Water</span>
          </a>

          <!-- Nutrition & Fiber -->
          <a href="#diet" class="nav-link" data-route="diet">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M12 4c-3.2 0 -6 2.8 -6 7c0 5 3 9 6 9s6 -4 6 -9c0 -4.2 -2.8 -7 -6 -7z"></path>
              <path d="M12 4v-2"></path>
              <path d="M9 12a3 3 0 0 0 6 0"></path>
            </svg>
            <span>Nutrition</span>
          </a>

          <!-- Digestive Health -->
          <a href="#bowel" class="nav-link" data-route="bowel">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M3 12h4l3 8l4 -16l3 8h4"></path>
            </svg>
            <span>Digestion</span>
          </a>

          <!-- Habit Routine -->
          <a href="#habits" class="nav-link" data-route="habits">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"></path>
              <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"></path>
              <path d="M9 14l2 2l4 -4"></path>
            </svg>
            <span>Habits</span>
          </a>

          <!-- Medications -->
          <a href="#meds" class="nav-link" data-route="meds">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M4.5 12.5l8 -8a4.95 4.95 0 0 1 7 7l-8 8a4.95 4.95 0 0 1 -7 -7"></path>
              <path d="M8.5 8.5l7 7"></path>
            </svg>
            <span>Medicines</span>
          </a>

          <!-- Doctor Mode -->
          <a href="#doctor-mode" class="nav-link" data-route="doctor-mode">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M6 4h-1a2 2 0 0 0 -2 2v3.5h0a5.5 5.5 0 0 0 11 0v-3.5a2 2 0 0 0 -2 -2h-1"></path>
              <path d="M8 15a6 6 0 0 0 12 0v-3"></path>
              <path d="M11 3v2"></path>
              <path d="M6 3v2"></path>
              <circle cx="20" cy="10" r="2"></circle>
            </svg>
            <span>Doctor Mode</span>
          </a>

          <!-- Settings -->
          <a href="#settings" class="nav-link" data-route="settings">
            <svg class="tabler-icon" viewBox="0 0 24 24">
              <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path>
              <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path>
            </svg>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <!-- Sidebar Bottom Area -->
      <div class="sidebar-bottom">
        <button class="btn btn--ink" id="btn-quick-entry" style="width: 100%;">
          <svg class="tabler-icon tabler-icon--sm" viewBox="0 0 24 24">
            <path d="M12 5l0 14"></path>
            <path d="M5 12l14 0"></path>
          </svg>
          <span>Log Entry</span>
        </button>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <div class="main-viewport">
      <!-- Sticky Clean Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="breadcrumbs">
            <span class="breadcrumbs-current" id="breadcrumb-title">Overview</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Today Date Pill -->
          <div class="pill-badge pill-badge--neutral" style="padding: 5px 10px; font-size: 11.5px; font-weight: 500;">
            <svg class="tabler-icon tabler-icon--sm" style="margin-right: 4px;" viewBox="0 0 24 24">
              <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z"></path>
              <path d="M16 3v4"></path>
              <path d="M8 3v4"></path>
              <path d="M4 11h16"></path>
            </svg>
            <span id="header-date-text">Today</span>
          </div>

          <!-- Theme Toggle -->
          <button id="theme-toggle-btn" class="btn btn--subtle" style="padding: 4px 8px; border-radius: var(--radius-sm); width: 32px; height: 32px;" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <svg class="tabler-icon tabler-icon--sm" id="theme-icon-slot" viewBox="0 0 24 24">
              <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path>
            </svg>
          </button>

          <!-- User Profile -->
          <div class="header-profile-badge">
            <div style="display: flex; flex-direction: column; text-align: right;" class="hidden-mobile">
              <span id="header-user-name" style="font-size: 12px; font-weight: 600; color: var(--text-ink); line-height: 1.2;">My Health</span>
            </div>
            <div id="header-user-avatar" style="width: 28px; height: 28px; border-radius: var(--radius-sm); background-color: var(--bg-surface-subtle); border: 1px solid var(--border-subtle); color: var(--text-ink); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;">
              NL
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="app-content" id="app-view"></main>

      <!-- Minimalist Clean Footer -->
      <footer class="app-footer">
        <div class="footer-inner" style="justify-content: center;">
          <span>© 2026 NorthLife</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar (< 768px) with Tabler Icons -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="#dashboard" class="nav-link nav-link--active" style="padding: 6px 10px; flex-direction: column; gap: 2px; font-size: 10px;">
      <svg class="tabler-icon" viewBox="0 0 24 24">
        <path d="M4 4h6v8h-6z"></path>
        <path d="M4 16h6v4h-6z"></path>
        <path d="M14 12h6v8h-6z"></path>
        <path d="M14 4h6v4h-6z"></path>
      </svg>
      <span>Today</span>
    </a>
    <a href="#bowel" class="nav-link" style="padding: 6px 10px; flex-direction: column; gap: 2px; font-size: 10px;">
      <svg class="tabler-icon" viewBox="0 0 24 24">
        <path d="M3 12h4l3 8l4 -16l3 8h4"></path>
      </svg>
      <span>Bowel</span>
    </a>
    <a href="#water" class="nav-link" style="padding: 6px 10px; flex-direction: column; gap: 2px; font-size: 10px;">
      <svg class="tabler-icon" viewBox="0 0 24 24">
        <path d="M7.502 19.423c2.602 2.105 6.394 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z"></path>
      </svg>
      <span>Water</span>
    </a>
    <a href="#meds" class="nav-link" style="padding: 6px 10px; flex-direction: column; gap: 2px; font-size: 10px;">
      <svg class="tabler-icon" viewBox="0 0 24 24">
        <path d="M4.5 12.5l8 -8a4.95 4.95 0 0 1 7 7l-8 8a4.95 4.95 0 0 1 -7 -7"></path>
        <path d="M8.5 8.5l7 7"></path>
      </svg>
      <span>Meds</span>
    </a>
    <a href="#doctor-mode" class="nav-link" style="padding: 6px 10px; flex-direction: column; gap: 2px; font-size: 10px;">
      <svg class="tabler-icon" viewBox="0 0 24 24">
        <path d="M6 4h-1a2 2 0 0 0 -2 2v3.5h0a5.5 5.5 0 0 0 11 0v-3.5a2 2 0 0 0 -2 -2h-1"></path>
        <path d="M8 15a6 6 0 0 0 12 0v-3"></path>
        <path d="M11 3v2"></path>
        <path d="M6 3v2"></path>
        <circle cx="20" cy="10" r="2"></circle>
      </svg>
      <span>Doctor</span>
    </a>
  </nav>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Core App Bootstrap Scripts -->
  <script src="assets/js/app.js"></script>
</body>
</html>
