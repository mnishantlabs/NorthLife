<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NorthLife — Clinical Titanium Personal Health Operating System."/>
  <title>NorthLife — Clinical Health OS</title>

  <!-- Google Fonts: 3-Face Typographic System -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Base Shared CSS -->
  <link rel="stylesheet" href="assets/css/variables.css"/>
  <link rel="stylesheet" href="assets/css/reset.css"/>
  <link rel="stylesheet" href="assets/css/layout.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-top">
        <div class="brand-header">
          <div class="brand-identity">
            <div class="brand-logo-badge">NL</div>
            <div class="brand-title-group">
              <span class="brand-name heading-serif">NorthLife</span>
              <span class="brand-subtitle">Clinical Health OS</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="#overview" class="nav-link nav-link--active" data-route="overview">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M4 4h6v8h-6z"></path><path d="M4 16h6v4h-6z"></path><path d="M14 12h6v8h-6z"></path><path d="M14 4h6v4h-6z"></path></svg>
            <span>Overview</span>
          </a>
          <a href="#timeline" class="nav-link" data-route="timeline">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M12 8v4l2 2"></path><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path></svg>
            <span>Universal Timeline</span>
          </a>
          <a href="#water" class="nav-link" data-route="water">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M7.502 19.423c2.602 2.105 6.394 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z"></path></svg>
            <span>Water Tracker</span>
          </a>
          <a href="#diet" class="nav-link" data-route="diet">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M12 4c-3.2 0 -6 2.8 -6 7c0 5 3 9 6 9s6 -4 6 -9c0 -4.2 -2.8 -7 -6 -7z"></path><path d="M12 4v-2"></path><path d="M9 12a3 3 0 0 0 6 0"></path></svg>
            <span>Nutrition & Fiber</span>
          </a>
          <a href="#bowel" class="nav-link" data-route="bowel">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M3 12h4l3 8l4 -16l3 8h4"></path></svg>
            <span>Digestive Care</span>
          </a>
          <a href="#custom-metrics" class="nav-link" data-route="custom-metrics">
            <svg class="tabler-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path></svg>
            <span>Custom Vitals</span>
          </a>
          <a href="#habits" class="nav-link" data-route="habits">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"></path><path d="M9 14l2 2l4 -4"></path></svg>
            <span>Daily Habits</span>
          </a>
          <a href="#meds" class="nav-link" data-route="meds">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M4.5 12.5l8 -8a4.95 4.95 0 0 1 7 7l-8 8a4.95 4.95 0 0 1 -7 -7"></path></svg>
            <span>Medications</span>
          </a>
          <a href="#doctor-mode" class="nav-link" data-route="doctor-mode">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M6 4h-1a2 2 0 0 0 -2 2v3.5h0a5.5 5.5 0 0 0 11 0v-3.5a2 2 0 0 0 -2 -2h-1"></path><path d="M8 15a6 6 0 0 0 12 0v-3"></path><circle cx="20" cy="10" r="2"></circle></svg>
            <span>Doctor Mode</span>
          </a>
          <a href="#settings" class="nav-link" data-route="settings">
            <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path></svg>
            <span>Settings & Vault</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button class="btn btn--primary" id="btn-quick-entry" style="width: 100%; height: 38px;">
          <svg class="tabler-icon tabler-icon--sm" viewBox="0 0 24 24"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>
          <span>+ Log Entry (L)</span>
        </button>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <div class="main-viewport">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="breadcrumbs">
            <span class="breadcrumbs-current" id="breadcrumb-title">Overview</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Offline Vault Indicator -->
          <div class="pill-badge pill-badge--neutral hidden-mobile" id="header-sync-status" style="padding: 5px 12px; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #10B981;"></span>
            <span>Offline Vault</span>
          </div>

          <!-- Today Date Pill -->
          <div class="pill-badge pill-badge--neutral" style="padding: 5px 12px; font-size: 12px; font-weight: 500;">
            <svg class="tabler-icon tabler-icon--sm" style="margin-right: 4px;" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z"></path><path d="M16 3v4"></path><path d="M8 3v4"></path><path d="M4 11h16"></path></svg>
            <span id="header-date-text">Today</span>
          </div>

          <!-- Theme Toggle -->
          <button id="theme-toggle-btn" class="btn btn--secondary btn--icon-only" title="Toggle Theme" aria-label="Toggle Theme">
            <svg class="tabler-icon tabler-icon--sm" viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path></svg>
          </button>

          <!-- User Avatar -->
          <div class="header-profile-badge">
            <div id="header-user-avatar" style="width: 28px; height: 28px; border-radius: var(--radius-pill); background-color: var(--text-ink); color: var(--text-inverse); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">
              NL
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="app-content" id="app-view"></main>

      <!-- Footer -->
      <footer class="app-footer">
        <span>© 2026 NorthLife • Clinical Titanium Edition</span>
      </footer>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="#overview" class="nav-link nav-link--active" style="flex-direction: column; gap: 2px; font-size: 10px; padding: 6px;">
      <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M4 4h6v8h-6z"></path><path d="M4 16h6v4h-6z"></path><path d="M14 12h6v8h-6z"></path><path d="M14 4h6v4h-6z"></path></svg>
      <span>Overview</span>
    </a>
    <a href="#water" class="nav-link" style="flex-direction: column; gap: 2px; font-size: 10px; padding: 6px;">
      <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M7.502 19.423c2.602 2.105 6.394 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z"></path></svg>
      <span>Water</span>
    </a>
    <a href="#diet" class="nav-link" style="flex-direction: column; gap: 2px; font-size: 10px; padding: 6px;">
      <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M12 4c-3.2 0 -6 2.8 -6 7c0 5 3 9 6 9s6 -4 6 -9c0 -4.2 -2.8 -7 -6 -7z"></path></svg>
      <span>Food</span>
    </a>
    <a href="#bowel" class="nav-link" style="flex-direction: column; gap: 2px; font-size: 10px; padding: 6px;">
      <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M3 12h4l3 8l4 -16l3 8h4"></path></svg>
      <span>Bowel</span>
    </a>
    <a href="#settings" class="nav-link" style="flex-direction: column; gap: 2px; font-size: 10px; padding: 6px;">
      <svg class="tabler-icon" viewBox="0 0 24 24"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path></svg>
      <span>Vault</span>
    </a>
  </nav>

  <!-- Global Modal Host -->
  <div id="modal-host" class="modal-overlay" aria-hidden="true">
    <div class="modal-dialog" id="modal-content"></div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="toast-stack" aria-live="polite"></div>

  <!-- Core App Controller -->
  <script src="assets/js/app.js"></script>
</body>
</html>
